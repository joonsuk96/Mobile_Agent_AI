[project]
name = "mobile-jarvis-app"
version = "0.1.0"
description = "LangChain agent for Android app discovery and UI navigation"
readme = "README.md"
authors = [
    { name = "joonsuk ahn", email = "samuelahn97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "androguard>=4.1.4",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
    "uiautomator2>=3.7.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mobile-jarvis-app = "mobile_jarvis_app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
